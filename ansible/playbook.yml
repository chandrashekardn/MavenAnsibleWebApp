---
- name: Deploy to Tomcat
  hosts: web
  become: yes
  tasks:
    - name: Copy War file
      copy:
        src: "/var/snap/jenkins/4870/workspace/MacenAnsible-CICD/target/MavenAnsibleWebApp.war"
        dest: "/opt/tomcat/webapps/MavenAnsibleWebApp.war"
        remote_src: no
      - name: Restart Tomcat
     	  systemd:
     		name: tomcat
     		state: restarted
